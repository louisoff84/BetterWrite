services:
  betterwrite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betterwrite
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      DATABASE_PATH: /data/betterwrite.sqlite
      NODE_ENV: production
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
