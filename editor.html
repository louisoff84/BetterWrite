<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Éditeur — BetterWrite</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script><script src="editor.js" defer></script><style>.editor-layout{display:grid;grid-template-columns:280px 1fr;gap:22px}.editor-panel,.writing-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}.chapter-btn{display:block;width:100%;text-align:left;padding:11px;border:0;border-radius:8px;background:transparent;color:var(--text);cursor:pointer}.chapter-btn.active{background:var(--soft);color:var(--purple)}.writing-panel input,.writing-panel textarea,.writing-panel [contenteditable]{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);padding:12px;margin:7px 0 15px}.writing-panel [contenteditable]{min-height:360px;line-height:1.8;outline:none}.toolbar{display:flex;gap:7px;margin:8px 0}.toolbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 11px;border-radius:7px;cursor:pointer}@media(max-width:700px){.editor-layout{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">B</span> BetterWrite</a><nav><a href="dashboard.html">Mes livres</a><a href="import.html">Importer</a></nav><div class="top-actions"><span id="saveState" style="font-size:11px;color:var(--muted)">Chargement…</span><button id="publish" class="btn btn-primary">Publier</button></div></header><main class="wrap section"><div class="field"><label>Titre du livre</label><input id="bookTitle" placeholder="Titre de votre livre"></div><div class="editor-layout"><aside class="editor-panel"><b>Chapitres</b><div id="chapterList"></div><button id="addChapter" class="btn btn-outline" style="width:100%;margin-top:12px">＋ Ajouter un chapitre</button><hr><div class="field"><label>Genre</label><input id="genre" placeholder="Fantasy, romance…"></div><div class="field"><label>Description</label><textarea id="description" rows="5" placeholder="Présentez votre livre"></textarea></div></aside><section class="writing-panel"><input id="chapterTitle" placeholder="Titre du chapitre"><div class="toolbar"><button data-cmd="bold"><b>G</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>S</u></button><button data-cmd="insertUnorderedList">• Liste</button><button data-cmd="formatBlock" data-value="h2">Titre</button></div><div id="content" contenteditable="true" data-placeholder="Votre histoire commence ici…"></div></section></div></main><div id="toast" class="toast"></div></body></html>
